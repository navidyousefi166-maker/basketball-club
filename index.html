<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>باشگاه بسکتبال</title><style>
*{box-sizing:border-box}body{margin:0;background:#141715;color:#faf5e8;font:16px/1.7 Tahoma,Arial,sans-serif}main{max-width:580px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #464a41;padding-bottom:12px}h1,h2,p{margin:0}h1{font-size:22px}h2{font-size:18px}header b{font:bold 22px monospace;color:#edaa67}section{margin:16px 0}.panel{padding:16px;border:1px solid #43463c;background:#20251f;border-radius:14px}button,input,select{font:inherit;border-radius:9px;padding:9px;color:inherit;background:#30372e;border:1px solid #59604f}button{cursor:pointer}button:disabled{opacity:.55}label{display:block;margin:10px 0}select,input{width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;background:#cbea8f;color:#21291b;font-weight:bold;margin-top:10px}.stat{display:grid;grid-template-columns:85px 1fr 46px;align-items:center;gap:10px;margin-top:6px}.bar{height:6px;border-radius:4px;background:#3d4439;overflow:hidden}.fill{height:100%;background:#b6cf8c}.note{color:#d8e5ba}small{color:#bfc4b7}nav{display:flex;gap:8px;margin-top:12px}nav button{flex:1}button[aria-pressed=true]{border-color:#cbea8f;color:#cbea8f}[hidden]{display:none!important}
.scouting{display:grid;grid-template-columns:minmax(0,1.16fr) minmax(0,1fr);background:#232a27;border:1px solid #485247;border-radius:18px;overflow:hidden}.details{padding:14px;align-self:center}.details strong{color:#badc94;font-size:13px}.details h2{overflow-wrap:anywhere}.details p,.details small{font-size:12px}.details h3{font-size:14px;margin:12px 0 4px}.stage{display:grid;align-items:end;background:linear-gradient(160deg,#f6d7ad,#c79973);padding:6px 0}.stage svg{width:100%;height:clamp(250px,61vw,320px)}.stat{grid-template-columns:1fr auto;gap:1px;font-size:12px;line-height:1.3}.stat b{grid-column:2;grid-row:1}.stat .bar{grid-column:1/-1;grid-row:2}#landing{padding:22px;background:linear-gradient(125deg,#283b36,#20251f)}#landing button{margin:0;min-height:52px}</style><main><header><h1>باشگاه بسکتبال</h1><b dir="ltr">2×2 ◉</b></header>
<section id="landing" class="panel"><button class="primary" id="choose">انتخاب شخصیت</button></section>
<div id="studio" hidden><label id="rolePicker">پست بازیکن<select id="role"></select></label><section class="scouting"><div class="details"><strong id="position"></strong><h2 id="title"></h2><p id="profile"></p><h3>توانایی‌ها <small>/ ۱۰۰</small></h3><div id="stats"></div></div><div class="stage"><svg id="figure" viewBox="0 0 150 260" role="img" aria-label="نمای تمام‌قد بازیکن">
<defs><linearGradient id="kit"><stop stop-color="#183e42"/><stop offset=".5" stop-color="#388487"/><stop offset="1" stop-color="#173e44"/></linearGradient><linearGradient id="flesh"><stop id="shade"/><stop offset=".65" id="tone"/></linearGradient><radialGradient id="leather" cx=".36" cy=".24" r=".84"><stop stop-color="#ffb862"/><stop offset=".7" stop-color="#ec7836"/><stop offset="1" stop-color="#b84825"/></radialGradient></defs>
<ellipse cx="76" cy="250" rx="42" ry="5" fill="#815b45" opacity=".32"/>
<g id="athlete" stroke-linejoin="round">
<g fill="url(#flesh)"><path d="M54 157 Q50 177 53 188 L48 231 Q50 236 59 233 L70 192 Q76 170 72 158Z"/><path d="M79 157 Q78 180 84 192 L88 232 Q94 235 99 230 L98 188 Q100 171 96 155Z"/>
<path d="M57 67 Q45 64 40 80 L30 106 Q26 116 27 125 L25 140 Q28 149 35 141 L40 119 L53 97Z"/><path d="M91 68 Q105 66 109 82 L116 103 Q120 111 116 119 L108 135 Q103 144 97 139 Q94 136 99 127 L104 112 L93 97Z"/>
<path d="M65 48 L64 64 L55 69 Q75 91 97 70 L83 63 L82 47Z"/></g>
<path d="M54 68 L63 64 Q72 82 85 64 L95 68 Q91 85 102 94 L96 130 Q76 136 51 130 L49 95 Q59 85 54 68Z" fill="url(#kit)"/>
<path d="M64 65 Q74 80 85 65 M54 69 Q59 85 50 94 M95 69 Q91 86 101 94" fill="none" stroke="#f1e1bd" stroke-width="2.3"/>
<text x="76" y="113" direction="ltr" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="25" fill="#f9ecd4">17</text>
<path d="M51 128 Q72 133 96 128 L101 165 L78 168 L74 153 L70 168 L47 164Z" fill="url(#kit)"/><path d="M52 131 Q72 135 96 131 M49 159 L69 163 M80 163 L99 160" fill="none" stroke="#e1d4ac" stroke-width="2"/>
<g fill="#eee9da"><path d="M49 217 L62 219 L58 236 L46 235Z"/><path d="M87 218 L99 216 L101 234 L89 237Z"/></g>
<g fill="#263439" stroke="#f7ebd4" stroke-width="2"><path d="M47 231 Q52 235 60 231 L59 244 Q48 248 34 246 Q31 242 41 238Z"/><path d="M87 232 Q93 235 101 230 L106 236 Q119 241 116 245 Q102 248 88 244Z"/></g>
<g id="head"><path id="jaw" fill="url(#flesh)"/><path d="M58 36 Q54 29 58 21 Q56 15 63 13 Q66 6 72 10 Q80 4 86 11 Q95 11 94 21 L90 35 L87 25 Q77 29 63 24 L61 37Z" fill="#272329"/><g fill="#37282a"><ellipse cx="67" cy="37" rx="1.8" ry="1.5"/><ellipse cx="81" cy="37" rx="1.8" ry="1.5"/></g><path d="M64 33 l6 -1 M79 32 l6 1 M71 48 q4 2 8 -1" fill="none" stroke="#634336" stroke-width="1.4" stroke-linecap="round"/></g>
<circle cx="27" cy="145" r="16" fill="url(#leather)"/><path d="M11 145 Q26 149 43 145 M26 129 Q33 144 28 161 M16 134 Q28 140 39 135 M15 155 Q24 146 39 156" fill="none" stroke="#84421f" stroke-width="1.2"/></g></svg></div></section>
<nav><button id="playerTab">شخصیت</button><button id="gymTab">باشگاه</button></nav>
<section id="editor" class="panel"><h2>مشخصات بازیکن</h2><label>نام بازیکن<input id="nameField" maxlength="20" placeholder="نام بازیکن"></label><div class="row"><label>رنگ پوست<select id="skin"><option>روشن</option><option>گندمی</option><option>سبزه</option><option>تیره</option></select></label><label>فرم صورت<select id="face"><option>کشیده</option><option>گرد</option><option>چهارگوش</option></select></label></div><button class="primary" id="confirm">ساخت بازیکن و ورود به باشگاه</button></section>
<section id="gym" class="panel" hidden><h2>تمرین امروز</h2><label>انتخاب تمرین<select id="training"></select></label><p class="note" id="effect"></p><button id="train" class="primary">انجام تمرین</button><p role="status" id="status"></p></section>
</div><p id="warning" role="status"></p></main>
<script>
const el=id=>document.getElementById(id);
const roles=[['پوینت گارد',185,[45,10,50,20,30]],['شوتینگ گارد',193,[50,20,42,24,35]],['اسمال فوروارد',200,[38,35,36,32,40]],['پاور فوروارد',206,[25,45,25,45,38]],['سنتر',212,[18,50,20,50,32]]];
const skills=['شوت','دانک','سرعت','قدرت بدنی','پرش'];
const sessions=['شوت آزاد','تمرین دانک','تردمیل','پرس سینه','پرش روی جعبه'];
const num=n=>n.toLocaleString('fa-IR');const today=()=>new Date().toLocaleDateString('en-CA');
let p={name:'',role:0,skin:1,face:0,created:false,gains:[0,0,0,0,0],day:'',last:0};
try{const saved=JSON.parse(localStorage.getItem('basketball.club.v1'));if(saved)Object.assign(p,saved)}catch{}
function save(){try{localStorage.setItem('basketball.club.v1',JSON.stringify(p))}catch{el('warning').textContent='این مرورگر اجازهٔ ذخیره نمی‌دهد. پیشرفت فقط تا زمان بستن صفحه حفظ می‌شود.'}}
function populate(id,items){items.forEach(t=>el(id).add(new Option(t)))}
populate('role',roles.map(r=>r[0]));populate('training',sessions);
el('nameField').value=p.name;['role','skin','face'].forEach(k=>el(k).selectedIndex=p[k]);
function portrait(){
  const colors=[['#bd856c','#f4c7a3'],['#a26c50','#dea579'],['#774736','#ae7554'],['#50352d','#81573f']];
  const [shadow,skin]=colors[p.skin];
  el('shade').setAttribute('stop-color',shadow);
  el('tone').setAttribute('stop-color',skin);
  const jaws=['M58 25 Q55 50 72 57 Q88 57 91 26Z','M58 25 Q51 54 74 55 Q95 53 91 25Z','M58 25 L59 45 Q61 54 68 55 L80 55 Q89 52 90 45 L91 25Z'];
  el('jaw').setAttribute('d',jaws[p.face]);
  const scale=roles[p.role][1]/212;
  el('athlete').setAttribute('transform','translate(75 248) scale('+scale+') translate(-75 -248)');
}
function render(){const [pos,h,base]=roles[p.role];el('position').textContent=pos;el('title').textContent=p.name||'بازیکن من';el('profile').textContent='۱۷ ساله · '+num(h)+' سانتی‌متر';portrait();el('stats').replaceChildren();
skills.forEach((s,i)=>{const v=Math.min(100,base[i]+p.gains[i]);const d=document.createElement('div');d.className='stat';d.innerHTML='<span>'+s+'</span><div class="bar"><div class="fill" style="width:'+v+'%"></div></div><b>'+num(v)+'</b>';el('stats').append(d)});
el('confirm').textContent=p.created?'ورود به باشگاه':'ساخت بازیکن و ورود به باشگاه';el('gymTab').disabled=!p.created;
const i=el('training').selectedIndex;const spent=p.day===today();el('train').disabled=spent||base[i]+p.gains[i]>=100;el('effect').textContent=skills[i]+' · تا ۰٫۲ واحد افزایش';el('status').textContent=spent?'تمرین امروز ثبت شد · '+sessions[p.last]+' · تمرین بعدی فردا':'هر روز یک تمرین انتخاب کن.'}
function tab(gym){el('rolePicker').hidden=gym;el('editor').hidden=gym;el('gym').hidden=!gym;el('playerTab').setAttribute('aria-pressed',!gym);el('gymTab').setAttribute('aria-pressed',gym);render()}
el('nameField').oninput=e=>{p.name=e.target.value.trim();save();render()};
['role','skin','face'].forEach(k=>el(k).onchange=e=>{p[k]=e.target.selectedIndex;save();render()});
el('confirm').onclick=()=>{p.created=true;save();tab(true)};el('gymTab').onclick=()=>tab(true);el('playerTab').onclick=()=>tab(false);
el('training').onchange=render;el('train').onclick=()=>{if(!p.created||p.day===today())return;const i=el('training').selectedIndex;p.gains[i]=Math.round((p.gains[i]+.2)*10)/10;p.day=today();p.last=i;save();render()};
window.addEventListener('focus',render);setInterval(render,60000);el('choose').onclick=()=>{el('landing').hidden=true;el('studio').hidden=false;tab(false);el('role').focus({preventScroll:true})};
</script></html>
