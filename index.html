*{box-sizing:border-box}body{margin:0;background:#141715;color:#faf5e8;font:16px/1.7 Tahoma,Arial,sans-serif}main{max-width:580px;margin:auto;padding:18px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #464a41;padding-bottom:12px}h1,h2,p{margin:0}h1{font-size:22px}h2{font-size:18px}header b{font:bold 22px monospace;color:#edaa67}section{margin:16px 0}.panel{padding:16px;border:1px solid #43463c;background:#20251f;border-radius:14px}button,input,select{font:inherit;border-radius:9px;padding:9px;color:inherit;background:#30372e;border:1px solid #59604f}button{cursor:pointer}button:disabled{opacity:.55}label{display:block;margin:10px 0}select,input{width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;background:#cbea8f;color:#21291b;font-weight:bold;margin-top:10px}.stat{display:grid;grid-template-columns:85px 1fr 46px;align-items:center;gap:10px;margin-top:6px}.bar{height:6px;border-radius:4px;background:#3d4439;overflow:hidden}.fill{height:100%;background:#b6cf8c}.note{color:#d8e5ba}small{color:#bfc4b7}nav{display:flex;gap:8px;margin-top:12px}nav button{flex:1}button[aria-pressed=true]{border-color:#cbea8f;color:#cbea8f}[hidden]{display:none!important}

const actionSheet = new Image();
const motionCanvas = el('motion');
const motionContext = motionCanvas.getContext('2d');
const stage = motionCanvas.parentElement;
const quietMotion = matchMedia('(prefers-reduced-motion: reduce)');
let actionStart = 0;
let animationFrame = 0;
let appearance = '';
const poseBounds = [[27,184],[194,358],[366,592]];
function setMotionVisible(show){
  motionCanvas.hidden=!show;
  stage.classList.toggle('motion-active',show);
}
function drawBall(ctx,x,y,angle){
  ctx.save(); ctx.translate(x,y);ctx.rotate(angle);
  const light=ctx.createRadialGradient(-3,-4,1,1,1,11);
  light.addColorStop(0,'#ffc77d');light.addColorStop(.5,'#e78b42');light.addColorStop(1,'#a64d25');
  ctx.fillStyle=light;ctx.beginPath();ctx.arc(0,0,10,0,2*Math.PI);ctx.fill();ctx.clip();
  ctx.strokeStyle='#733a22';ctx.lineWidth=.9;ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(10,0);ctx.moveTo(0,-10);ctx.lineTo(0,10);
  ctx.moveTo(-8,-8);ctx.bezierCurveTo(1,-4,1,4,-8,8);ctx.moveTo(8,-8);ctx.bezierCurveTo(-1,-4,-1,4,8,8);ctx.stroke();ctx.restore();
}
function playAction(now){
  animationFrame=0;
  if(document.hidden||el('studio').hidden||quietMotion.matches||!actionSheet.naturalWidth){setMotionVisible(false);return}
  const elapsed=((now-actionStart)/1000)%9;
  const active=elapsed>=1.1&&elapsed<8.7;
  setMotionVisible(active);
  if(active){
    const ctx=motionContext;
    const t=elapsed-1.1;
    const floor=278,scale=roles[p.role][1]/212;
    ctx.setTransform(2,0,0,2,0,0);ctx.clearRect(0,0,170,290);
    ctx.translate(85,floor);ctx.scale(scale,scale);ctx.translate(-85,-floor);
    let pose=0,dy=0,squash=1,bx=36,by=0;
    if(t<2.8||t>=5.5){
      const phase=(t<2.8?t:t-5.5)/.7%1;
      const bounce=1-Math.abs(2*phase-1);
      squash=1-.025*bounce;
      by=floor-61+51*bounce*bounce;
    }else if(t<3.18){
      const u=(t-2.8)/.38;
      pose=1;squash=1-.06*Math.sin(Math.PI*u);
      bx=36+54*u;by=floor-61-100*u;
    }else{
      const u=t-3.18;
      pose=u<.74?2:0;
      dy=u<.74?-21*Math.sin(Math.PI*u/.74):0;
      const release=.18;
      if(u<release){bx=90-19*u/release;by=floor-161-63*u/release+dy}
      else if(u<1.26){const flight=(u-release)/1.08;bx=71+163*flight;by=floor-238-144*flight+113*flight*flight}
      else{const back=(u-1.26)/(5.5-3.18-1.26);bx=206-170*back;by=floor-10-130*(1-back)*(1-back)-51*back*back}
    }
    ctx.fillStyle='rgba(62,40,29,.17)';ctx.beginPath();ctx.ellipse(85,floor-1,38+dy*.38,3.5,0,0,2*Math.PI);ctx.fill();
    const [top,bottom]=poseBounds[pose], height=(bottom-top)*squash;
    const ratio=actionSheet.naturalWidth/600;
    ctx.drawImage(actionSheet,p.skin*150*ratio,top*ratio,150*ratio,(bottom-top)*ratio,10,floor+dy-height,150,height);
    drawBall(ctx,bx,by,t*4.6);
  }
  animationFrame=requestAnimationFrame(playAction);
}
function updateMotion(){
  const key=[p.face,p.skin,p.role].join('/');
  if(key!==appearance){appearance=key;actionStart=performance.now();setMotionVisible(false)}
  if(!animationFrame&&!el('studio').hidden&&!document.hidden&&!quietMotion.matches&&actionSheet.naturalWidth){
    animationFrame=requestAnimationFrame(playAction);
  }

}
function render(){const [pos,h,base]=roles[p.role];el('roleName').textContent=pos;el('position').textContent=pos;el('title').textContent=p.name||'بازیکن من';el('profile').textContent='۱۷ ساله · '+num(h)+' سانتی‌متر';portrait();el('stats').replaceChildren();
skills.forEach((s,i)=>{const v=Math.min(100,base[i]+p.gains[i]);const d=document.createElement('div');d.className='stat';d.innerHTML='<span>'+s+'</span><div class="bar"><div class="fill" style="width:'+v+'%"></div></div><b>'+num(v)+'</b>';el('stats').append(d)});
el('confirm').textContent=p.created?'ورود به باشگاه':'ساخت بازیکن و ورود به باشگاه';el('gymTab').disabled=!p.created;
const i=el('training').selectedIndex;const spent=p.day===today();el('train').disabled=spent||base[i]+p.gains[i]>=100;el('effect').textContent=skills[i]+' · تا ۰٫۲ واحد افزایش';el('status').textContent=spent?'تمرین امروز ثبت شد · '+sessions[p.last]+' · تمرین بعدی فردا':'هر روز یک تمرین انتخاب کن.'}
function tab(gym){el('rolePicker').hidden=gym;el('editor').hidden=gym;el('gym').hidden=!gym;el('playerTab').setAttribute('aria-pressed',!gym);el('gymTab').setAttribute('aria-pressed',gym);render()}
function changeRole(step){
  p.role=(p.role+step+roles.length)%roles.length;
  save();
  render();
}
el('nextRole').onclick=()=>changeRole(1);
el('prevRole').onclick=()=>changeRole(-1);
el('rolePicker').onkeydown=e=>{
  if(e.key!=='ArrowLeft' && e.key!=='ArrowRight') return;
  e.preventDefault();
  changeRole(e.key==='ArrowLeft'?1:-1);
};
el('nameField').oninput=e=>{p.name=e.target.value.trim();save();render()};
['skin','face'].forEach(k=>el(k).onchange=e=>{p[k]=e.target.selectedIndex;save();render()});
el('confirm').onclick=()=>{p.created=true;save();tab(true)};el('gymTab').onclick=()=>tab(true);el('playerTab').onclick=()=>tab(false);
el('training').onchange=render;el('train').onclick=()=>{if(!p.created||p.day===today())return;const i=el('training').selectedIndex;p.gains[i]=Math.round((p.gains[i]+.2)*10)/10;p.day=today();p.last=i;save();render()};
window.addEventListener('focus',render);setInterval(render,60000);el('choose').onclick=()=>{el('landing').hidden=true;el('studio').hidden=false;tab(false);el('nextRole').focus({preventScroll:true})};
</script></html>
